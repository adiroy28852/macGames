# Dead as Disco (Steam 3404260) — Unreal Engine, DX12 by default.
NAME="Dead as Disco"
# DXMT only translates D3D10/11, so ask the engine for its D3D11 renderer.
# -nosound: Wine can't open CoreAudio output on this Mac yet ("Unit failed to
# start: 'what'"), and the game exits when its audio device times out.
ARGS="-dx11 -nosound"
ENV=""
